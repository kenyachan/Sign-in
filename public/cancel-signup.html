<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cancel sign-up</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/cancel-signup.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Cancel sign-up</h1>
    <p class="subtitle" id="message" role="status">Someone created an account with your email address.
      If it wasn't you, cancel it here and the account will be deleted.</p>
    <!-- A button, not automatic: email apps that open links to scan them won't cancel anything. -->
    <button type="button" class="danger-button solid" id="cancel">Cancel this sign-up</button>
    <a class="primary button-link" id="next" href="/signup" hidden>Create an account</a>
  </main>
</body>
</html>
