<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Create account</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/signup.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Create account</h1>
    <p class="subtitle">It only takes a minute.</p>

    <form id="signup-form" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" type="text" required
                 autocomplete="given-name" maxlength="50"
                 aria-describedby="firstName-error">
          <p class="error" id="firstName-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="lastName">Last name <span class="optional">(optional)</span></label>
          <input id="lastName" name="lastName" type="text"
                 autocomplete="family-name" maxlength="50"
                 aria-describedby="lastName-error">
          <p class="error" id="lastName-error" aria-live="polite"></p>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required
               autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254"
               aria-describedby="email-hint email-error">
        <p class="hint" id="email-hint">You'll use this to sign in. We'll send you a link to confirm it.</p>
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-row">
          <input id="password" name="password" type="password" required
                 autocomplete="new-password" minlength="12" maxlength="128"
                 passwordrules="minlength: 12; maxlength: 128;"
                 aria-describedby="password-hint password-error">
          <button type="button" class="toggle" data-toggle="password"
                  aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <p class="hint" id="password-hint">At least 12 characters. A short phrase works well.</p>
        <p class="error" id="password-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" required
               autocomplete="new-password" maxlength="128"
               aria-describedby="confirm-error">
        <p class="error" id="confirm-error" aria-live="polite"></p>
      </div>

      <button type="submit" class="primary">Create account</button>
      <p class="status" id="status" role="status"></p>
    </form>

    <p class="footer">Already have an account? <a href="/signin">Sign in</a></p>
  </main>
</body>
</html>
