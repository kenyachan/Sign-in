<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/signin.js"></script>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Welcome back.</p>

    <form id="signin-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required
               autocomplete="username webauthn" inputmode="email" autocapitalize="none" spellcheck="false"
               maxlength="254">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-row">
          <input id="password" name="password" type="password" required
                 autocomplete="current-password" maxlength="128">
          <button type="button" class="toggle" data-toggle="password"
                  aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>

      <button type="submit" class="primary">Sign in</button>
    </form>

    <div id="passkey-option" hidden>
      <p class="divider"><span>or</span></p>
      <button type="button" class="secondary" id="passkey-button">Sign in with a passkey</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <details class="resend" id="resend">
      <summary>Didn't get the confirmation email?</summary>
      <form id="resend-form" novalidate>
        <div class="field">
          <label for="resend-email">Email</label>
          <input id="resend-email" name="email" type="email" required
                 autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254">
        </div>
        <button type="submit" class="secondary">Send a new confirmation link</button>
        <p class="status" id="resend-status" role="status"></p>
      </form>
    </details>

    <p class="footer"><a href="/recover">Forgot your password or lost your passkey?</a></p>
    <p class="footer footer-tight">New here? <a href="/signup">Create an account</a></p>
  </main>
</body>
</html>
